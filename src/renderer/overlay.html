<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>截图覆盖层</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <canvas id="bg"></canvas>
  <div id="dim"></div>
  <div id="winHl"></div>
  <canvas id="annot"></canvas>

  <div id="selBox">
    <i class="h" data-h="nw"></i>
    <i class="h" data-h="n"></i>
    <i class="h" data-h="ne"></i>
    <i class="h" data-h="w"></i>
    <i class="h" data-h="e"></i>
    <i class="h" data-h="sw"></i>
    <i class="h" data-h="s"></i>
    <i class="h" data-h="se"></i>
  </div>
  <div id="sizeLabel"></div>

  <canvas id="mag" width="120" height="120"></canvas>
  <div id="magHex"></div>

  <div id="toolbar">
    <button class="tb" data-tool="rect" title="矩形 (R)">
      <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg>
    </button>
    <button class="tb" data-tool="ellipse" title="椭圆 (E)">
      <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg>
    </button>
    <button class="tb" data-tool="arrow" title="箭头 (A)">
      <svg viewBox="0 0 24 24"><path d="M5 19 L18 6 M18 6 h-6.5 M18 6 v6.5"/></svg>
    </button>
    <button class="tb" data-tool="pen" title="画笔 (P)">
      <svg viewBox="0 0 24 24"><path d="M4 20 l1.2-4.2 L16.4 4.6 a2.2 2.2 0 0 1 3.1 3.1 L8.3 18.9 Z"/></svg>
    </button>
    <button class="tb" data-tool="marker" title="荧光笔 (M)">
      <svg viewBox="0 0 24 24"><path d="M6 15 L14.5 5.5 a2 2 0 0 1 3 2.6 L10 17.5 H6 Z M6 20.5 h12"/></svg>
    </button>
    <button class="tb" data-tool="text" title="文字 (T)">
      <svg viewBox="0 0 24 24"><path d="M5 6 V4.5 h14 V6 M12 4.5 V19.5 M9 19.5 h6"/></svg>
    </button>
    <button class="tb" data-tool="mosaic" title="马赛克 (B)">
      <svg viewBox="0 0 24 24">
        <rect x="4" y="4" width="5" height="5"/><rect x="10" y="4" width="5" height="5" opacity=".55"/><rect x="16" y="4" width="5" height="5" opacity=".55" transform="translate(-1 0)"/>
        <rect x="4" y="10" width="5" height="5" opacity=".55"/><rect x="10" y="10" width="5" height="5"/><rect x="15" y="10" width="5" height="5" opacity=".55"/>
        <rect x="4" y="16" width="5" height="5" opacity=".55"/><rect x="10" y="16" width="5" height="5" opacity=".55"/><rect x="16" y="16" width="5" height="5"/>
      </svg>
    </button>

    <i class="sep"></i>
    <button class="tb" id="undoBtn" title="撤销 (Ctrl+Z)">
      <svg viewBox="0 0 24 24"><path d="M8 5 L3 10 l5 5 M3 10 h11 a6 6 0 0 1 0 12 h-3"/></svg>
    </button>
    <button class="tb" id="redoBtn" title="重做 (Ctrl+Y)">
      <svg viewBox="0 0 24 24"><path d="M16 5 l5 5 -5 5 M21 10 H10 a6 6 0 0 0 0 12 h3"/></svg>
    </button>

    <i class="sep"></i>
    <span id="swatches"></span>

    <i class="sep"></i>
    <span id="widths">
      <button class="wd" data-w="2" title="细"><i style="width:4px;height:4px"></i></button>
      <button class="wd" data-w="4" title="中"><i style="width:7px;height:7px"></i></button>
      <button class="wd" data-w="6" title="粗"><i style="width:10px;height:10px"></i></button>
    </span>

    <i class="sep"></i>
    <button class="tb" id="ocrBtn" title="文字识别 (O)">
      <svg viewBox="0 0 24 24">
        <path d="M4 8 V5.5 A1.5 1.5 0 0 1 5.5 4 H8 M16 4 h2.5 A1.5 1.5 0 0 1 20 5.5 V8 M20 16 v2.5 A1.5 1.5 0 0 1 18.5 20 H16 M8 20 H5.5 A1.5 1.5 0 0 1 4 18.5 V16"/>
        <path d="M7 9.5 h10 M7 12.5 h10 M7 15.5 h6"/>
      </svg>
    </button>
    <button class="tb" id="pinBtn" title="贴图（钉在桌面）">
      <svg viewBox="0 0 24 24"><path d="M9 3 h6 l-1 6 3.5 3.5 H14 v6 l-2 2.5 -2-2.5 v-6 H6.5 L10 9 Z"/></svg>
    </button>
    <button class="tb" id="saveBtn" title="保存 (Ctrl+S)">
      <svg viewBox="0 0 24 24"><path d="M12 3 v11 M7.5 10 L12 14.5 16.5 10 M4 17 v3 h16 v-3"/></svg>
    </button>
    <button class="tb primary" id="copyBtn" title="复制 (Enter / Ctrl+C)">
      <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8 V6 a2 2 0 0 0 -2-2 H6 a2 2 0 0 0 -2 2 v8 a2 2 0 0 0 2 2 h2"/></svg>
    </button>
    <button class="tb" id="closeBtn" title="关闭 (Esc)">
      <svg viewBox="0 0 24 24"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
    </button>
  </div>

  <input id="textInput" spellcheck="false" />

  <div id="ocrPanel" style="display:none">
    <div class="ocr-head">
      <span id="ocrTitle">文字识别</span>
      <span class="ocr-head-btns">
        <button id="ocrCopyAll">复制全部</button>
        <button id="ocrClose">关闭</button>
      </span>
    </div>
    <div id="ocrLines"></div>
  </div>
  <div id="toast"></div>

  <script src="overlay.js"></script>
</body>
</html>

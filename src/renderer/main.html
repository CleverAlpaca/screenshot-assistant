<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>截图助手</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <div id="window">
    <div id="titlebar">
      <span class="title">截图助手</span>
      <button id="closeBtn" title="关闭">
        <svg viewBox="0 0 24 24"><path d="M6 6 L18 18 M18 6 L6 18" /></svg>
      </button>
    </div>

    <div id="body">
      <aside id="sidebar">
        <button class="nav-item" data-page="history" title="历史记录">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M12 7.5 v4.5 l3 2" /></svg>
          <span>历史记录</span>
        </button>
        <button class="nav-item active" data-page="settings" title="设置">
          <svg viewBox="0 0 24 24"><path d="M4 6 h16 M4 12 h16 M4 18 h16" /><circle cx="9" cy="6" r="2.2" /><circle cx="15" cy="12" r="2.2" /><circle cx="7" cy="18" r="2.2" /></svg>
          <span>设置</span>
        </button>
      </aside>

      <main id="pages">
        <!-- ===== 设置页 ===== -->
        <section class="page active" id="page-settings">
          <div class="card">
            <h3>截图</h3>
            <div class="row">
              <div>
                <div class="label">全局快捷键</div>
                <div class="hint">任意界面按下即开始框选</div>
              </div>
              <span id="hotkeyBadge" class="kbd">F1</span>
            </div>
          </div>

          <div class="card">
            <h3>保存</h3>
            <div class="row">
              <span class="label">保存方式</span>
              <div class="seg" id="saveModeSeg">
                <button class="seg-item" data-v="ask">每次询问</button>
                <button class="seg-item" data-v="auto">自动保存</button>
              </div>
            </div>
            <div class="row">
              <div>
                <div class="label">默认目录</div>
                <div class="hint" id="dirHint"></div>
              </div>
              <button class="btn btn-secondary" id="chooseDirBtn">选择…</button>
            </div>
          </div>

          <div class="card">
            <h3>贴图</h3>
            <div class="row">
              <div>
                <div class="label">默认不透明度</div>
                <div class="hint">滚轮缩放 · 双击关闭 · 右键菜单</div>
              </div>
              <div class="sliderRow">
                <input type="range" id="pinOpacity" min="50" max="100" step="5" />
                <span id="pinOpacityVal" class="kbd">100%</span>
              </div>
            </div>
          </div>

          <div class="card">
            <h3>外观</h3>
            <div class="row">
              <span class="label">主题</span>
              <div class="seg" id="themeSeg">
                <button class="seg-item" data-v="system">跟随系统</button>
                <button class="seg-item" data-v="light">浅色</button>
                <button class="seg-item" data-v="dark">深色</button>
              </div>
            </div>
          </div>

          <div class="card">
            <h3>通用</h3>
            <div class="row">
              <span class="label">开机自动启动</span>
              <button class="toggle" id="autostart" aria-label="开机自动启动"></button>
            </div>
          </div>

          <div class="about">
            <span id="version"></span>
            <a href="#" id="openData">打开数据目录</a>
          </div>
        </section>

        <!-- ===== 历史记录页 ===== -->
        <section class="page" id="page-history">
          <div class="page-head">
            <span id="countBadge" class="badge"></span>
            <button id="clearBtn" title="清空应用内历史">清空</button>
          </div>
          <div id="empty" style="display:flex">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M12 7.5 v4.5 l3 2" /></svg>
            </div>
            <div class="empty-text" id="emptyText">加载中…</div>
          </div>
          <div id="hList"></div>
        </section>
      </main>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
